[profile.default]
src = "contracts"
test = "contracts/test"
script = "contracts/script"
out = "contracts/out"
libs = ["lib"]
cache_path = "contracts/cache"
solc_version = "0.8.28"
auto_detect_solc = false
evm_version = "paris"
optimizer = true
optimizer_runs = 1        # 1 = smallest bytecode (critical: V3 contract is 39KB, limit is 24KB)
via_ir = true             # Required — fixes stack too deep in complex functions

[profile.default.model_checker]
engine = "chc"
